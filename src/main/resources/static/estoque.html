<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciamento de Estoque - Loja de Construção</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .card {
            max-width: 900px;
            text-align: left;
        }
        .estoque-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-top: 20px;
        }
        .form-estoque {
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.8);
        }
        .estoque-lista {
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.8);
        }
        .item-estoque {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed #ddd;
        }
        .item-estoque:last-child {
            border-bottom: none;
        }
        .nav-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #007bff;
        }
        .nav-bar a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            padding: 5px 10px;
            transition: color 0.3s;
        }
        .nav-bar a:hover {
            color: #0056b3;
        }
        .produto-info {
            flex: 1;
        }
        .item-estoque button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }
        .item-estoque button:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Gerenciamento de Estoque</h1>

            <div class="nav-bar">
                <a href="inicio.html">Início/Calendário</a>
                <a href="estoque.html">Estoque</a>
                <a href="cadastro_afazeres.html">Afazeres</a>
                <a href="chat.html">Chat</a>
                <a href="login.html" style="color: #dc3545;">Sair</a>
            </div>

            <div class="estoque-grid">
                <div class="form-estoque">
                    <h2>Adicionar Material</h2>
                    <form id="formProduto">
                        <div class="input-group">
                            <label for="nomeProduto">Nome do Material</label>
                            <input type="text" id="nomeProduto" required>
                        </div>
                        <div class="input-group">
                            <label for="descricaoProduto">Descrição</label>
                            <input type="text" id="descricaoProduto" required>
                        </div>
                        <div class="input-group">
                            <label for="precoProduto">Preço (R$)</label>
                            <input type="number" id="precoProduto" step="0.01" required>
                        </div>
                        <div class="input-group">
                            <label for="quantidadeProduto">Quantidade</label>
                            <input type="number" id="quantidadeProduto" required>
                        </div>
                        <button type="submit" class="btn-primary">Adicionar ao Estoque</button>
                    </form>
                </div>

                <div class="estoque-lista">
                    <h2>Estoque Atual</h2>
                    <div id="listaProdutos">
                        <p style="text-align: center; color: #999;">Carregando produtos...</p>
                    </div>
                </div>
            </div>
            <p id="mensagemProduto" class="message" style="margin-top: 20px;"></p>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            carregarProdutos();
        });
    </script>
</body>
</html>
