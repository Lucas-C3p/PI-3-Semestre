<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Afazeres</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .card {
            max-width: 900px;
            text-align: left;
        }
        .afazeres-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
            margin-top: 20px;
        }
        .form-afazeres {
            padding: 20px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.8);
        }
        .lista-afazeres {
            max-height: 400px;
            overflow-y: auto;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: rgba(255, 255, 255, 0.8);
        }
        .item-tarefa {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px dashed #ddd;
        }
        .item-tarefa:last-child {
            border-bottom: none;
        }
        .tarefa-info {
            flex: 1;
        }
        .tarefa-info p {
            margin: 3px 0;
            font-size: 0.9em;
        }
        .nav-bar {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #007bff;
        }
        .nav-bar a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            padding: 5px 10px;
            transition: color 0.3s;
        }
        .nav-bar a:hover {
            color: #0056b3;
        }
        .item-tarefa button {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
            margin-left: 10px;
        }
        .item-tarefa button:hover {
            background-color: #c82333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Gerenciamento de Afazeres</h1>

            <div class="nav-bar">
                <a href="inicio.html">Início/Calendário</a>
                <a href="estoque.html">Estoque</a>
                <a href="cadastro_afazeres.html">Afazeres</a>
                <a href="chat.html">Chat</a>
                <a href="login.html" style="color: #dc3545;">Sair</a>
            </div>

            <div class="afazeres-grid">
                <div class="form-afazeres">
                    <h2>Cadastrar Novo Afazer</h2>
                    <form id="formTarefa">
                        <div class="input-group">
                            <label for="tituloTarefa">Título</label>
                            <input type="text" id="tituloTarefa" required>
                        </div>
                        <div class="input-group">
                            <label for="descricaoTarefa">Descrição</label>
                            <textarea id="descricaoTarefa" rows="3" required style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box;"></textarea>
                        </div>
                        <div class="input-group">
                            <label for="dataVencimentoTarefa">Data de Vencimento</label>
                            <input type="date" id="dataVencimentoTarefa" required>
                        </div>
                        <div class="input-group">
                            <label for="statusTarefa">Status</label>
                            <select id="statusTarefa" required>
                                <option value="Pendente">Pendente</option>
                                <option value="Em Progresso">Em Progresso</option>
                                <option value="Concluído">Concluído</option>
                            </select>
                        </div>
                        <div class="input-group">
                            <label for="responsavelTarefa">Responsável</label>
                            <input type="text" id="responsavelTarefa" required>
                        </div>
                        <button type="submit" class="btn-primary">Adicionar Afazer</button>
                    </form>
                </div>

                <div class="lista-afazeres">
                    <h2>Afazeres Cadastrados</h2>
                    <div id="listaTarefas">
                        <p style="text-align: center; color: #999;">Carregando afazeres...</p>
                    </div>
                </div>
            </div>
            <p id="mensagemTarefa" class="message" style="margin-top: 20px;"></p>
        </div>
    </div>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            carregarTarefas();
        });
    </script>
</body>
</html>
